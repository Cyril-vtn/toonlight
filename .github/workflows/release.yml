# Builds the installers when a version tag (v1.2.3) is pushed, and puts them on a draft GitHub
# release. Check the draft, then press "Publish release". See docs/RELEASING.md.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            formats: nsis
          - name: macOS (Apple Silicon)
            os: macos-latest
            formats: app,dmg
          - name: Linux
            os: ubuntu-22.04
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libasound2-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libfuse2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$ver" ]; then echo "Tag v$tag but Cargo.toml says $ver"; exit 1; fi
      - name: Tests
        run: cargo test --release
      - name: Build the installers
        run: cargo packager --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v7
        with:
          name: toonlight-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  release:
    name: Draft release
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, "## " v)) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
          files: artifacts/*
