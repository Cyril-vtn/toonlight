# Checks every push and pull request: formatting, lints, tests, on Windows, macOS and Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    # macOS runners are scarce on GitHub's free plan and can wait in the queue for a while;
    # this only limits how long the job may run once it has started
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libasound2-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      # The real app is started where a screen (or a stand-in for one) exists: it must open its
      # window, draw, save a picture of itself and quit. TOONLIGHT_PEN_LOG makes the pen listener
      # say whether it could start.
      - name: Build the app
        if: runner.os != 'Windows'
        run: cargo build
      - name: The app starts and draws (Linux, on a virtual screen)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          TOONLIGHT_PEN_LOG: 1
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libxkbcommon-x11-0
          export TOONLIGHT_CONFIG_DIR="$RUNNER_TEMP/settings"
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            ./target/debug/toonlight --screenshot "$RUNNER_TEMP/toonlight-linux.png" > "$RUNNER_TEMP/start.log" 2>&1 || true
          cat "$RUNNER_TEMP/start.log"
          test -s "$RUNNER_TEMP/toonlight-linux.png"
          grep -q "pen: X11: listening" "$RUNNER_TEMP/start.log"
      - name: The app starts and draws (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        env:
          TOONLIGHT_PEN_LOG: 1
        run: |
          export TOONLIGHT_CONFIG_DIR="$RUNNER_TEMP/settings"
          ./target/debug/toonlight --screenshot "$RUNNER_TEMP/toonlight-macos.png" > "$RUNNER_TEMP/start.log" 2>&1 || true
          cat "$RUNNER_TEMP/start.log"
          test -s "$RUNNER_TEMP/toonlight-macos.png"
          grep -q "pen: macOS: listening" "$RUNNER_TEMP/start.log"
      - name: Keep the picture of the app
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: started-${{ matrix.os }}
          path: ${{ runner.temp }}/toonlight-*.png
          if-no-files-found: ignore
          retention-days: 14
