[package]
name = "toonlight"
version = "0.16.0-beta.1"
edition = "2021"
license = "MIT"
description = "Free, open-source 2D frame-by-frame animation software"
repository = "https://github.com/Cyril-vtn/toonlight"
readme = "README.md"
keywords = ["animation", "2d", "drawing", "frame-by-frame", "egui"]
categories = ["multimedia::images", "graphics"]
rust-version = "1.85"
build = "build.rs"

[dependencies]
# No "accesskit" feature on purpose: with this version, the accessibility tree stops the app on
# Windows as soon as a program reads the screen while a panel moves (see CHANGELOG, 0.16.0-beta.2).
# Turn it back on with a newer eframe, and keep CI's "screen reader" walk green.
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "tiff", "tga", "bmp"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
ab_glyph = "0.2"
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rodio = { version = "=0.20.1", default-features = false, features = ["wav", "symphonia-mp3"] }

# Pen tablets: each system has its own way to say what the pen does (see src/tablet.rs).
# macOS: pen pressure and tilt, read from the app's events
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"

# Windows: the pen's tilt, rotation and eraser end, read from the pointer messages
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_Pointer", "Win32_UI_WindowsAndMessaging"] }

# Linux and the BSDs: the pen's pressure, tilt and eraser end, read from the X server
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", default-features = false, features = ["xinput"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

# Installers and app bundles, made by `cargo packager --release` (see docs/RELEASING.md).
[package.metadata.packager]
product-name = "Toonlight"
identifier = "io.github.cyril-vtn.toonlight"
publisher = "Toonlight contributors"
category = "GraphicsAndDesign"
copyright = "Copyright (c) 2026 Toonlight contributors"
description = "Free, open-source 2D frame-by-frame animation software"
license-file = "LICENSE"
icons = ["assets/icon-32.png", "assets/icon-128.png", "assets/icon-256.png", "assets/icon-512.png"]
before-packaging-command = "cargo build --release"
out-dir = "dist"
binaries = [{ path = "toonlight", main = true }]
file-associations = [{ extensions = ["toonlight"], name = "Toonlight project", description = "Toonlight animation project", role = "editor" }]

[package.metadata.packager.macos]
minimum-system-version = "11.0"

[package.metadata.packager.nsis]
installer-icon = "assets/icon.ico"
